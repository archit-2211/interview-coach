spring.config.import=optional:file:.env[.properties]
spring.application.name=interview-coach
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

jwt.secret=${JWT_SECRET}

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.level.root=INFO
logging.level.com.interviewcoach.project=DEBUG
logging.structured.format.console=logstash

management.tracing.sampling.probability=1.0

# Export traces using OTLP/HTTP to Alloy
management.opentelemetry.tracing.export.otlp.endpoint=http://alloy:4318/v1/traces
management.otlp.metrics.export.enabled=false