services:

  mysql:
    image: mysql:8.4

    container_name: interview-coach-mysql

    environment:
    
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: interview_coach

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  prometheus:
    image: prom/prometheus:latest
    container_name: interview-coach-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - interview-coach
  interview-coach:
    build:
      context: .
      dockerfile: Dockerfile

    image: interview-coach:latest
    container_name: interview-coach-server

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CLIENT_DOMAIN: ${CLIENT_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy
  grafana:
    image: grafana/grafana:latest
    container_name: interview-coach-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: interview-coach-loki

    ports:
      - "3100:3100"

    volumes:
      - loki-data:/loki

    command: -config.file=/etc/loki/local-config.yaml

  alloy:
    image: grafana/alloy:latest
    container_name: interview-coach-alloy

    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    command:
      - run
      - /etc/alloy/config.alloy

    depends_on:
      - loki

volumes:
  mysql-data:

  grafana-data:
    external: true
  
  loki-data:
  